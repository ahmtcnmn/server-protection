spring.application.name=agent

server.port=8091

manager.api-key=bSjK__9E0Tpq5HMVgUnY62ucdRQU3TRDA2DqJhtlJ90
manager.base-url:https://localhost:8443
manager.post-url:/api/agents/heartbeat
manager.event-url-sql=/api/events/create

# Agent log dosyaları
agent.log-file-path=/tmp/test-access.log
agent.db-log-file-path=/tmp/test-db.log
agent.process-command=tail -f /tmp/test-system.log

spring.datasource.url=jdbc:h2:file:./data/agent-queue
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Log ayarları: Spring/Hibernate/Tomcat yalnız uyarı ve hata yazar, Agent kendi loglarını yazar
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.ahmtcnmn=INFO
logging.level.com.ahmtcnmn.agent.AgentApplication=WARN
# true → her log satırı (LOG) ve HTTP detayları (HTTP) da görünür
agent.log.debug=false

# Engel süresi (1h, 2m, 30s)
agent.block-duration=1h
# Süresi dolan engellerin kontrol aralığı (ms)
agent.unblock-check-ms=5000
