spring.application.name=agent

server.port=8091

manager.api-key=bSjK__9E0Tpq5HMVgUnY62ucdRQU3TRDA2DqJhtlJ90
manager.base-url:https://localhost:8443
manager.post-url:/api/agents/heartbeat
manager.event-url-sql=/api/events/create
# Manager'ın sertifikası (self-signed). Yalnız bu sertifikaya güvenilir; Manager'ın keystore'u değişirse
# yeni sertifikayı dışa aktarıp burayı ya da sunucudaki override dosyasını güncelleyin (file:/opt/sentinel/manager-cert.pem).
spring.ssl.bundle.pem.manager.truststore.certificate=classpath:manager-cert.pem

# Agent log dosyaları
agent.log-file-path=/tmp/test-access.log
agent.db-log-file-path=/tmp/test-db.log
agent.process-command=tail -f /tmp/test-system.log

# Tespit kuralları (rules/parsers, rules/detectors). Jar'ın içinde DEĞİL: sunucuda /opt/sentinel/rules.
# Klasör dakikada bir kontrol edilir, değişen kurallar yeniden başlatmadan devreye girer.
# Yerelde agent/ klasöründen çalıştırınca repo kökündeki rules/ kullanılır.
agent.rules-dir=../rules
# Her kaynağın parser'ları (sırayla denenir, ilk uyan kazanır)
agent.log-parsers=nginx-access
agent.db-log-parsers=raw-line
agent.process-parsers=raw-line

spring.datasource.url=jdbc:h2:file:./data/agent-queue
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Log ayarları: Spring/Hibernate/Tomcat yalnız uyarı ve hata yazar, Agent kendi loglarını yazar
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.ahmtcnmn=INFO
logging.level.com.ahmtcnmn.agent.AgentApplication=WARN
# true → her log satırı (LOG) ve HTTP detayları (HTTP) da görünür
agent.log.debug=false

# Engel süresini artık Manager belirler (security.ban-duration); Agent kararları decision stream'den okur.
# Manager hatayla istese bile Agent'ın asla engellemeyeceği IP'ler (son emniyet)
agent.never-block=127.0.0.1,::1
